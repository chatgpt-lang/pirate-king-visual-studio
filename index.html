<script>
const icons={contest:'<svg viewBox="0 0 24 24"><path d="M4 10h16v10H4zM3 7h18v3H3zM12 7v13M12 7H8.8a2.2 2.2 0 1 1 2.1-3c.6.8 1.1 1.8 1.1 3Zm0 0h3.2a2.2 2.2 0 1 0-2.1-3c-.6.8-1.1 1.8-1.1 3Z"/></svg>',live:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="m17 10 4-2v8l-4-2zM8 9l4 3-4 3z"/></svg>',card:'<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 17h5"/></svg>',vote:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg>'};
const defaults={contest:{name:'Concours',formats:['reel','thumb'],badge:'JEU CONCOURS',title:'GIVE ABONNÉ',subtitle:'100% GRATUIT',bottom:'Détails en description',showLogo:true,showBadge:true,showBottom:true,titleColor:'#e21b23',secondaryColor:'#233f79',accentColor:'#f4c430',bgColor:'#f8fafc'},live:{name:'Live',formats:['reel','post','thumb'],badge:'14/09 — 20:00',title:'OP10 BOXBREAK',subtitle:'1€ PDD',lot:'1 MANGA À GAGNER',bottom:'',showLogo:true,showBadge:true,showBottom:false,align:'center',titleColor:'#e21b23',secondaryColor:'#233f79',accentColor:'#f4c430',bgColor:'#f8fafc'},card:{name:'Carte',formats:['reel','post'],badge:'',title:'',subtitle:'',bottom:'PIRATE KING TCG',showLogo:true,showBadge:false,showBottom:true,ambience:'dark',topPull:true,topPullText:'TOP PULL',topPullPosition:'top',glow:12,cardScale:100,cardY:0,cardRotate:0,titleColor:'#ffffff',secondaryColor:'#233f79',accentColor:'#e21b23',bgColor:'#17191d'},vote:{name:'Vote',formats:['reel'],badge:'',title:'QUEL EST TON CHOIX ?',subtitle:'',bottom:'',showLogo:true,showBadge:false,showBottom:false,teamA:'TEAM A',teamB:'TEAM B',cta:'VOTE EN COMMENTAIRE',titleColor:'#233f79',secondaryColor:'#233f79',accentColor:'#f4c430',bgColor:'#fff4e6'}};
const states=structuredClone(defaults);let active='contest',format='reel';const $=s=>document.querySelector(s),art=$('#artboard');
function nav(){const names=['contest','live','card','vote'];$('#atelierNav').innerHTML=names.map(k=>`<button class="atelier ${k===active?'active':''}" data-a="${k}">${icons[k]}<span>${states[k].name}</span></button>`).join('');document.querySelectorAll('.atelier').forEach(b=>b.onclick=()=>{active=b.dataset.a;format=states[active].formats[0];renderAll()})}const formatNames={reel:'Reel 9:16',post:'Post 4:5',thumb:'Miniature 16:9'};function formatTabs(){$('#formats').innerHTML=states[active].formats.map(f=>`<button class="format ${f===format?'active':''}" data-f="${f}">${formatNames[f]}</button>`).join('');document.querySelectorAll('.format').forEach(b=>b.onclick=()=>{format=b.dataset.f;renderPreview();formatTabs()})}
function field(id,label,value){return `<div class="field"><label>${label}</label><input id="${id}" type="text" value="${String(value||'').replaceAll('"','&quot;')}"></div>`}function toggle(id,label,val){return `<label class="toggle-row"><span>${label}</span><input class="toggle" id="${id}" type="checkbox" ${val?'checked':''}></label>`}function upload(id,label){return `<div class="dropzone"><b>Déposez votre ${label} ici</b>ou choisir un fichier<input id="${id}" type="file" accept="image/png,image/jpeg,image/webp"></div>`}
function settings(){const s=states[active];$('#settingsTitle').textContent=s.name;let h='<div class="section"><div class="section-name">CONTENU</div>';if(active==='contest')h+=upload('mainUpload','image')+field('badge','Petit badge',s.badge)+field('title','Titre ligne 1',s.title)+field('subtitle','Titre ligne 2',s.subtitle)+field('bottom','Texte bas',s.bottom);if(active==='live')h+=field('badge','Date et heure',s.badge)+field('title','Titre',s.title)+field('subtitle','Sous-titre',s.subtitle)+field('lot','Lot',s.lot)+upload('mainUpload','produit ou carte')+'<div class="field"><label>Alignement</label><select id="align"><option value="center">Centré</option><option value="left">À gauche</option></select></div>';if(active==='card')h+=upload('mainUpload','carte')+field('topPullText','Texte Top Pull',s.topPullText)+'<div class="field"><label>Position Top Pull</label><select id="topPullPosition"><option value="top">Haut</option><option value="behind">Centre derrière</option><option value="bottom">Bas</option></select></div>';if(active==='vote')h+=field('title','Titre',s.title)+upload('uploadA','carte A')+field('teamA','Nom A',s.teamA)+upload('uploadB','carte B')+field('teamB','Nom B',s.teamB)+field('cta','Texte CTA',s.cta);h+='</div><div class="section"><div class="section-name">OPTIONS</div>'+toggle('showLogo','Afficher le logo',s.showLogo);if(active==='contest')h+=toggle('showBadge','Afficher le badge',s.showBadge)+toggle('showBottom','Afficher le texte bas',s.showBottom);if(active==='card')h+=toggle('topPull','Afficher TOP PULL',s.topPull)+`<div class="field"><label>Intensité du glow</label><input id="glow" type="range" min="0" max="35" value="${s.glow}"></div><div class="field"><label>Taille de la carte</label><input id="cardScale" type="range" min="70" max="140" value="${s.cardScale}"></div><div class="field"><label>Position verticale</label><input id="cardY" type="range" min="-100" max="100" value="${s.cardY}"></div><div class="field"><label>Rotation</label><select id="cardRotate"><option value="-3">-3°</option><option value="0">0°</option><option value="3">+3°</option></select></div>`;h+='</div>';if(active==='card')h+='<div class="section"><div class="section-name">AMBIANCE</div><div class="style-grid"><button class="style-card" data-style="dark"><i></i>Nuages manga</button><button class="style-card" data-style="cloudsAnimated"><i></i>Nuages manga animés</button><button class="style-card" data-style="sakura"><i></i>Sakura</button><button class="style-card" data-style="fire"><i></i>Feu</button></div></div>';$('#dynamicSettings').innerHTML=h;bindDynamic()}
function bindInput(id){const el=$('#'+id);if(!el)return;if(el.tagName==='SELECT'&&states[active][id]!=null)el.value=states[active][id];el.oninput=()=>{states[active][id]=el.type==='checkbox'?el.checked:el.type==='range'?+el.value:el.value;renderPreview()}}function bindDynamic(){['badge','title','subtitle','bottom','lot','teamA','teamB','cta','topPullText','topPullPosition','align','showLogo','showBadge','showBottom','topPull','glow','cardScale','cardY','cardRotate'].forEach(bindInput);document.querySelectorAll('.style-card').forEach(b=>{b.classList.toggle('active',b.dataset.style===states.card.ambience);b.onclick=()=>{states.card.ambience=b.dataset.style;settings();renderPreview()}});bindUpload('mainUpload','image');bindUpload('uploadA','imageA');bindUpload('uploadB','imageB')}
function bindUpload(id,key){const el=$('#'+id);if(!el)return;const dz=el.parentElement;['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.style.borderColor='#e21b23'}));dz.addEventListener('dragleave',()=>dz.style.borderColor='');dz.addEventListener('drop',e=>{e.preventDefault();dz.style.borderColor='';loadFile(e.dataTransfer.files[0],key)});el.onchange=e=>loadFile(e.target.files[0],key)}function loadFile(file,key){if(!file)return;states[active][key]=URL.createObjectURL(file);renderPreview()}
function renderPreview(){const s=states[active];art.className='artboard '+format+' '+(active==='card'?'card-mode ambience-'+s.ambience:active==='vote'?'vote-mode':active);art.classList.remove('fade');void art.offsetWidth;art.classList.add('fade');art.style.setProperty('--title-size',$('#titleSize').value+'px');art.style.setProperty('--card-scale',(s.cardScale||100)/100);art.style.setProperty('--card-y',(s.cardY||0)+'px');art.style.setProperty('--card-rotate',(s.cardRotate||0)+'deg');art.style.setProperty('--glow',(s.glow||0)+'px');$('.visual-bg').style.backgroundColor=s.bgColor;$('.visual-logo').classList.toggle('hidden',!s.showLogo);$('#vBadge').textContent=s.badge||'';$('#vBadge').classList.toggle('hidden',!s.showBadge);$('#vTitle').textContent=s.title||'';$('#vSubtitle').textContent=s.subtitle||'';$('#vBottom').textContent=s.bottom||'';$('#vBottom').classList.toggle('hidden',!s.showBottom);$('#vDate').textContent=active==='live'?s.badge:'';$('#vLot').textContent=s.lot||'';const img=$('#media'),ph=$('#placeholder');if(s.image){img.src=s.image;img.classList.remove('hidden');ph.classList.add('hidden')}else{img.classList.add('hidden');ph.classList.toggle('hidden',active==='vote')}$('#topPull').textContent=s.topPullText||'';$('#topPull').classList.toggle('hidden',active!=='card'||!s.topPull);$('#topPull').style.top=s.topPullPosition==='behind'?'43%':s.topPullPosition==='bottom'?'82%':'15%';$('#split').classList.toggle('hidden',active!=='vote');$('#vCta').classList.toggle('hidden',active!=='vote');if(active==='vote')renderVote(s);document.documentElement.style.setProperty('--red',s.titleColor);document.documentElement.style.setProperty('--blue',s.secondaryColor);document.documentElement.style.setProperty('--yellow',s.accentColor);if(active==='live'&&s.align==='left'&&format!=='thumb'){[$('#vTitle'),$('#vSubtitle')].forEach(x=>{x.style.textAlign='left';x.style.left='8%'})}else{[$('#vTitle'),$('#vSubtitle')].forEach(x=>{x.style.textAlign='';x.style.left=''})}}
function renderVote(s){$('#teamA').textContent=s.teamA;$('#teamB').textContent=s.teamB;$('#vCta').textContent=s.cta;[['cardA','imageA'],['cardB','imageB']].forEach(([id,k])=>{const el=$('#'+id);if(s[k]){el.src=s[k];el.classList.remove('hidden')}else el.classList.add('hidden')})}function bindGlobal(){[['colorTitle','titleColor'],['colorSecondary','secondaryColor'],['colorAccent','accentColor'],['colorBg','bgColor']].forEach(([id,k])=>{const el=$('#'+id);el.value=states[active][k];el.oninput=e=>{states[active][k]=e.target.value;renderPreview()}});$('#titleFont').onchange=e=>document.documentElement.style.setProperty('--title-font',e.target.value);$('#secondaryFont').onchange=e=>document.documentElement.style.setProperty('--secondary-font',e.target.value+',Arial,sans-serif');$('#titleSize').oninput=renderPreview;$('#weight').onchange=e=>{$('#vTitle').style.fontWeight=e.target.value;$('#topPull').style.fontWeight=e.target.value}}
function renderAll(){nav();formatTabs();settings();bindGlobal();renderPreview()}function toast(msg='Visuel généré'){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}$('#generate').onclick=()=>toast();$('#exportTop').onclick=()=>toast('Aperçu prêt pour export');$('#reset').onclick=()=>{states[active]=structuredClone(defaults[active]);format=states[active].formats[0];renderAll();toast('Atelier réinitialisé')};renderAll();
